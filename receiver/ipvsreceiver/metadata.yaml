---
attributes:
  forward_type:
    description: The forward type of the real service destination.
    enum:
      - masquerade
      - local
      - tunnel
      - directroute
      - bypass
    requirement_level: recommended
    type: string
  netmask:
    description: The netmask of the service.
    requirement_level: recommended
    type: string
  protocol:
    description: The protocol of the service.
    enum:
      - tcp
      - udp
      - sctp
    requirement_level: recommended
    type: string
  rip_address:
    description: The IP address of the real service destination.
    requirement_level: recommended
    type: string
  rip_family:
    description: The IP address family of the real service destination.
    enum:
      - inet
      - inet6
    requirement_level: recommended
    type: string
  rip_port:
    description: The port of the real service destination.
    requirement_level: recommended
    type: string
  sched:
    description: The scheduler of the service.
    enum:
      - dh
      - lblc
      - lblcr
      - lc
      - mh
      - nq
      - rr
      - sed
      - sh
      - wlc
      - wrr
    requirement_level: recommended
    type: string
  tunnel_port:
    description: The tunnel port of the real service destination.
    requirement_level: recommended
    type: string
  tunnel_type:
    description: The tunnel type of the real service destination.
    enum:
      - ipip
      - gue
      - gre
    requirement_level: recommended
    type: string
  vip_address:
    description: The IP address of the virtual service.
    requirement_level: recommended
    type: string
  vip_family:
    description: The IP address family of the virtual service.
    enum:
      - inet
      - inet6
    requirement_level: recommended
    type: string
  vip_port:
    description: The port of the virtual service.
    requirement_level: recommended
    type: string
display_name: IPVS Receiver
metrics:
  ipvs.destination.connection.active.count:
    attributes:
      - netmask
      - protocol
      - sched
      - vip_address
      - vip_family
      - vip_port
      - forward_type
      - tunnel_port
      - tunnel_type
      - rip_address
      - rip_family
      - rip_port
    description: Number of active connections to the destination.
    enabled: true
    gauge:
      value_type: int
    stability: development
    unit: "1"
  ipvs.destination.connection.inactive.count:
    attributes:
      - netmask
      - protocol
      - sched
      - vip_address
      - vip_family
      - vip_port
      - forward_type
      - tunnel_port
      - tunnel_type
      - rip_address
